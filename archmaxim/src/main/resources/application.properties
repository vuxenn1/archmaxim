# Defaults for local development. In Docker every value below can be overridden
# with an environment variable: archmaxim.search.max-distance becomes
# ARCHMAXIM_SEARCH_MAX_DISTANCE, spring.datasource.url becomes SPRING_DATASOURCE_URL.
# Personal overrides go in application-local.properties (git-ignored), used
# when the app runs with the "local" profile.

spring.application.name=archmaxim

spring.datasource.url=jdbc:postgresql://localhost:5432/archmaxim_db
spring.datasource.username=postgres
# spring.datasource.password has no default: set SPRING_DATASOURCE_PASSWORD.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Databases created before Flyway already have tables; V1 is written to run on them too.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=${ARCHMAXIM_UPLOAD_MAX_SIZE:50MB}
spring.servlet.multipart.max-request-size=${ARCHMAXIM_UPLOAD_MAX_SIZE:50MB}
# Lets Tomcat read an oversized upload to the end so the client gets the 413 response.
server.tomcat.max-swallow-size=-1

# The backend runs behind nginx, which forwards the client address and the /api prefix.
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=${archmaxim.swagger.enabled}
springdoc.swagger-ui.enabled=${archmaxim.swagger.enabled}

# archmaxim.jwt.secret has no default: set ARCHMAXIM_JWT_SECRET (at least 32 bytes).
archmaxim.jwt.expiration=24h

archmaxim.embedding.url=http://localhost:8000
archmaxim.embedding.connect-timeout=5s
archmaxim.embedding.read-timeout=60s

archmaxim.storage.location=./storage

# The first admin is created from these when the database has no admin yet.
archmaxim.admin.email=admin@archmaxim.edu
# archmaxim.admin.password has no default: set ARCHMAXIM_ADMIN_PASSWORD for the first start.

archmaxim.upload.allowed-extensions=pdf,doc,docx,ppt,pptx,xls,xlsx,odt,odp,ods,txt,md,rtf,csv,zip,rar,7z,png,jpg,jpeg

archmaxim.search.max-distance=0.6
archmaxim.search.course-boost=0.1
archmaxim.search.fuzzy-threshold=0.9
archmaxim.search.max-limit=50

archmaxim.indexing.retry-interval=5m

archmaxim.login.max-attempts=5
archmaxim.login.lockout=15m

archmaxim.swagger.enabled=false
