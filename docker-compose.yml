services:

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: post123
      POSTGRES_DB: archmaxim_db
    volumes:
      - archmaxim-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  embedding:
    build: ./archmaxim-embedding-service
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface

  backend:
    build: ./archmaxim
    depends_on:
      - db
      - embedding
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/archmaxim_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: post123
      ARCHMAXIM_EMBEDDING_URL: http://embedding:8000
      ARCHMAXIM_STORAGE_LOCATION: /data/storage
      ARCHMAXIM_JWT_SECRET: archmaxim-secret-key-that-is-long-enough-for-hs256-algorithm
    volumes:
      - file-storage:/data/storage
  frontend:
    build: ./archmaxim-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  archmaxim-data:
  hf-cache:
  file-storage: