services:

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: archmaxim_db
    volumes:
      - archmaxim-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archmaxim_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  embedding:
    build: ./archmaxim-embedding-service
    restart: unless-stopped
    volumes:
      - embedding-models:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the model (about 4.5 GB on disk).
      start_period: 20m
      start_interval: 10s

  backend:
    build: ./archmaxim
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/archmaxim_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ARCHMAXIM_JWT_SECRET: ${ARCHMAXIM_JWT_SECRET:?Set ARCHMAXIM_JWT_SECRET in .env}
      ARCHMAXIM_EMBEDDING_URL: http://embedding:8000
      ARCHMAXIM_STORAGE_LOCATION: /data/storage
      ARCHMAXIM_ADMIN_EMAIL: ${ARCHMAXIM_ADMIN_EMAIL:-admin@archmaxim.edu}
      ARCHMAXIM_ADMIN_PASSWORD: ${ARCHMAXIM_ADMIN_PASSWORD:?Set ARCHMAXIM_ADMIN_PASSWORD in .env}
      ARCHMAXIM_SWAGGER_ENABLED: ${ARCHMAXIM_SWAGGER_ENABLED:-false}
    volumes:
      - file-storage:/data/storage

  frontend:
    build: ./archmaxim-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${ARCHMAXIM_PORT:-3000}:80"

volumes:
  archmaxim-data:
  file-storage:
  embedding-models:
